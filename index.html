<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Macondo&family=Special+Elite&family=Story+Script&display=swap"
      rel="stylesheet"
    />
    <title>Machine à invocation</title>
  </head>
  <body>
    <section class="machine-invocation">
      <h1 class="titre">La machine à invocation</h1>
      <form id="invocation">
        <label for="prenom">Prénom</label><input type="text" id="prenom" />
        <label for="creature">Créature</label>
        <select name="" id="creature">
          <option value="chat">🐙 le Chat-Octo</option>
          <option value="dragon">🐉 le Dragon-Debug</option>
          <option value="licorne">🦄 la Licorne-CSS</option>
          <option value="renard">🦊 le Renard-Refacto</option>
        </select>
        <button class="invoquer">Invoquer</button>
      </form>
    </section>
    <section id="resultat" class="cache">
      <p id="message"></p>
    </section>
  </body>
  <script src="script.js"></script>
</html>
